html_content = """<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSE Countdown - sanayuk</title>
    <link rel="icon" type="image/jpeg" href="snypfp.jpg">
    <link rel="stylesheet" href="style.css?v=8">
    <style>
        .countdown-feed {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            text-align: left;
            width: 100%;
        }
        .countdown-card {
            background: var(--link-bg);
            border: 1px solid #ccc;
            padding: 15px; /* Reduced padding from 20px */
            border-radius: 4px;
            box-shadow: 1px 1px 0px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .countdown-subject {
            font-size: 1.05rem; /* Slightly smaller font to fit nicely */
            color: var(--text-color);
            margin-bottom: 5px;
            line-height: 1.3;
        }
        .countdown-date {
            font-size: 0.85rem; /* Slightly smaller */
            color: #888;
            margin-bottom: 12px;
        }
        .countdown-timer {
            font-size: 1.2rem; /* Slightly smaller timer */
            color: #000;
            font-weight: normal;
            font-family: "Times New Roman", Times, serif;
            margin-top: auto;
        }
        .good-luck {
            color: var(--text-color);
            font-weight: bold;
            font-style: italic;
            font-size: 1rem;
        }

        /* Make it 1 column on mobile phones */
        @media (max-width: 600px) {
            .countdown-feed {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <a href="index.html" class="header-left">
            <img src="snypfp.jpg" alt="Profile Picture" class="header-pfp">
            <span class="header-name">sanayuk</span>
        </a>
        
        <div class="header-right">
            <a href="about.html" class="header-link">About</a>
        </div>
    </header>

    <!-- Reduced max-width from 800px to 700px -->
    <div class="container" style="max-width: 700px; margin-top: 0;">
        <h1 style="margin-bottom: 30px;">DSE Countdown</h1>
        
        <div class="countdown-feed" id="countdown-container">
            <!-- Countdowns will be injected here via JS -->
        </div>
    </div> 

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-left">
                <h4 class="footer-heading">Contact Me</h4>
                <a href="mailto:sanayuuuk@gmail.com?subject=Contact from Website" class="footer-link">
                    sanayuuuk@gmail.com
                </a>
            </div>

            <div class="footer-right">
                <h4 class="footer-heading">Socials</h4>
                <div class="footer-socials">
                    <a href="https://www.youtube.com/@sanayuk____" target="_blank">YouTube</a> —
                    <a href="https://www.instagram.com/sanayuk____/" target="_blank">Instagram</a> —
                    <a href="https://www.threads.net/@sanayuk____/" target="_blank">Threads</a> —
                    <a href="https://open.spotify.com/user/31xqgkz4tjc3syadxhh52vzdo4kq?si=254b2dc9a4f743eb&nd=1&dlsi=bdf17cccaf9b42ae" target="_blank">Spotify</a>
                </div>
            </div>
        </div>

        <div class="footer-bottom">
            <span>© 2026 | sanayuk</span>
        </div>
    </footer>

    <script>
        const exams = [
            { dateStr: "2027/04/08 08:30", subject: "Chinese Language (1) & (2)", targetDate: new Date("2027-04-08T08:30:00").getTime() },
            { dateStr: "2027/04/09 08:30", subject: "English Language (1) & (2)", targetDate: new Date("2027-04-09T08:30:00").getTime() },
            { dateStr: "2027/04/10 09:15", subject: "English Language (3)", targetDate: new Date("2027-04-10T09:15:00").getTime() },
            { dateStr: "2027/04/12 08:30", subject: "Mathematics (1) & (2)", targetDate: new Date("2027-04-12T08:30:00").getTime() },
            { dateStr: "2027/04/13 08:30", subject: "Citizenship and Social Development", targetDate: new Date("2027-04-13T08:30:00").getTime() },
            { dateStr: "2027/04/17 08:30", subject: "ICT (1) & (2)", targetDate: new Date("2027-04-17T08:30:00").getTime() },
            { dateStr: "2027/04/22 08:30", subject: "Economics (1) & (2)", targetDate: new Date("2027-04-22T08:30:00").getTime() }
        ];

        const container = document.getElementById("countdown-container");

        exams.forEach((exam, index) => {
            const card = document.createElement("div");
            card.className = "countdown-card";
            card.innerHTML = `
                <div>
                    <div class="countdown-subject">${exam.subject}</div>
                    <div class="countdown-date">${exam.dateStr}</div>
                </div>
                <div class="countdown-timer" id="timer-${index}">...</div>
            `;
            container.appendChild(card);
        });

        function updateCountdowns() {
            const now = new Date().getTime();

            exams.forEach((exam, index) => {
                const timerEl = document.getElementById(`timer-${index}`);
                const distance = exam.targetDate - now;

                if (distance <= 0) {
                    timerEl.innerHTML = "<span class='good-luck'>Good luck with your exam!</span>";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                timerEl.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
            });
        }

        setInterval(updateCountdowns, 1000);
        updateCountdowns(); 
    </script>
</body>
</html>
