<script>
    function calculateAge(birthDateString) {
        const birthDate = new Date(birthDateString);
        const today = new Date();
        
        let age = today.getFullYear() - birthDate.getFullYear();
        const monthDifference = today.getMonth() - birthDate.getMonth();

        if (monthDifference < 0 || (monthDifference === 0 && today.getDate() < birthDate.getDate())) {
            age--;
        }
        
        return age;
    }

    const myBirthday = '2009-02-16'; 
    document.getElementById('my-age').innerText = calculateAge(myBirthday);

    // Fetch last commit date from GitHub API
    async function updateLastModified() {
        try {
            const response = await fetch('https://api.github.com/repos/sanayuk/sanayuk.com/commits?per_page=1');
            const data = await response.json();
            
            // Parse the ISO date from the commit data
            const commitDate = new Date(data[0].commit.committer.date);
            
            // Adjust to UTC+8 (Hong Kong Time) manually to ensure perfect formatting across all browsers
            const hkTime = new Date(commitDate.getTime() + (8 * 60 * 60 * 1000));
            
            const y = hkTime.getUTCFullYear();
            const m = String(hkTime.getUTCMonth() + 1).padStart(2, '0');
            const d = String(hkTime.getUTCDate()).padStart(2, '0');
            const h = String(hkTime.getUTCHours()).padStart(2, '0');
            const min = String(hkTime.getUTCMinutes()).padStart(2, '0');

            document.getElementById('last-updated').innerText = `${y}/${m}/${d} ${h}:${min} (UTC +8)`;
        } catch (error) {
            console.error('Error fetching last update:', error);
            document.getElementById('last-updated').innerText = 'Unavailable';
        }
    }
    
    updateLastModified();
</script>
